version: '3.8'
services:
  d415-rviz-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: d415-rviz-test
    container_name: d415_rviz_test
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      # Similar to your other setup: mount user code into a subfolder to not overwrite built deps
      - ./workspace/src:/workspace/src/user_code
    privileged: true
    devices:
      - "/dev/bus/usb:/dev/bus/usb"
    tty: true
    stdin_open: true
